<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Add Item</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div class="logo">🔍 Lost & Found</div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/items.html">Items</a></li>
            <li><a href="/form.html" class="active">Add Item</a></li>
            <li><a href="/about.html">About</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Add New Item</h1>
            <p>Fill in the details below to report a lost or found item.</p>
            
            <div id="alertContainer"></div>

            <form id="itemForm">
                <div class="form-group">
                    <label for="type">Type *</label>
                    <select id="type" required>
                        <option value="">Select Type</option>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Item Name *</label>
                    <input type="text" id="name" placeholder="e.g., Black Wallet" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Wallet">Wallet</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Bottle">Bottle</option>
                        <option value="ID Card">ID Card</option>
                        <option value="Bag">Bag</option>
                        <option value="Keys">Keys</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Stationery">Stationery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" placeholder="e.g., Central Library" required>
                </div>

                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" placeholder="Describe the item in detail..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" required>
                        <option value="">Select Status</option>
                        <option value="Searching">Searching</option>
                        <option value="Found">Found</option>
                        <option value="Returned">Returned</option>
                        <option value="Claim Pending">Claim Pending</option>
                        <option value="Reported">Reported</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Add Item</button>
                <button type="reset" class="btn btn-warning">Reset</button>
            </form>
        </div>
    </div>

    <script src="/js/form.js"></script>
</body>
</html>
