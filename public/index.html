<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Portal - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div class="logo">🔍 Lost & Found</div>
        <ul>
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/items.html">Items</a></li>
            <li><a href="/form.html">Add Item</a></li>
            <li><a href="/about.html">About</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Welcome to Lost & Found Portal</h1>
            <p>Helping students and staff find lost items or report found items on campus.</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-box">
                <div class="number" id="totalItems">0</div>
                <div class="label">Total Items</div>
            </div>
            <div class="stat-box">
                <div class="number" id="lostItems">0</div>
                <div class="label">Lost Items</div>
            </div>
            <div class="stat-box">
                <div class="number" id="foundItems">0</div>
                <div class="label">Found Items</div>
            </div>
            <div class="stat-box">
                <div class="number" id="returnedItems">0</div>
                <div class="label">Returned Items</div>
            </div>
        </div>

        <div class="card">
            <h2>Recent Items</h2>
            <div class="items-grid" id="recentItems"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
